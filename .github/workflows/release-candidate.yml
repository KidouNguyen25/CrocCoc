name: Windows release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (e.g. 0.1.0-rc.1)
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: windows-release-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate candidate version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+-(rc|mvp|beta)\.[1-9]\d*$') { throw 'Prerelease only' }
          $app = (Get-Content -Raw wails.json | ConvertFrom-Json).info.productVersion
          if (($env:RELEASE_VERSION -split '-', 2)[0] -ne $app) { throw 'Version does not match wails.json.' }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install build tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          if ($LASTEXITCODE -ne 0) { throw 'Wails install failed' }
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          if ($LASTEXITCODE -ne 0) { throw 'govulncheck install failed' }
          "$(go env GOPATH)\bin" >> $env:GITHUB_PATH
      - name: Build and run quality gates
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/build-release.ps1 -PackageVersion $env:RELEASE_VERSION
          ./scripts/build-installer.ps1 -PackageVersion $env:RELEASE_VERSION
      - name: Generate download checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $names = @("CrocCoc-$env:RELEASE_VERSION-win64.zip", "CrocCoc-$env:RELEASE_VERSION-win64-setup.exe")
          $names | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path release $_)).Hash
            "$hash  $_"
          } | Set-Content -Encoding ascii release/download-SHA256SUMS.txt
      - name: Attest portable ZIP and installer (public repositories)
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*-setup.exe
      - name: Upload unsigned QA candidate
        uses: actions/upload-artifact@v4
        with:
          name: CrocCoc-${{ inputs.version }}-unsigned
          path: |
            release/*.zip
            release/*-setup.exe
            release/download-SHA256SUMS.txt
          if-no-files-found: error
