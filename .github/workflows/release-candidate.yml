name: Windows release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (e.g. 0.1.0-rc.1)
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: windows-release-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate candidate version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+-(rc|mvp|beta)\.[1-9]\d*$') { throw 'Prerelease only' }
          $app = (Get-Content -Raw wails.json | ConvertFrom-Json).info.productVersion
          if (($env:RELEASE_VERSION -split '-', 2)[0] -ne $app) { throw 'Version does not match wails.json.' }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install build tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          if ($LASTEXITCODE -ne 0) { throw 'Wails install failed' }
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          if ($LASTEXITCODE -ne 0) { throw 'govulncheck install failed' }
          "$(go env GOPATH)\bin" >> $env:GITHUB_PATH
      - name: Parse release scripts
        shell: pwsh
        run: ./scripts/qa/check-release-scripts.ps1
      - name: Build and run quality gates
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/build-release.ps1 -PackageVersion $env:RELEASE_VERSION
          ./scripts/build-installer.ps1 -PackageVersion $env:RELEASE_VERSION -DownloadWebView2Bootstrapper
      - name: Verify packaged bytes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/verify-release.ps1 -PackageVersion $env:RELEASE_VERSION
      - name: Smoke test installer on disposable Windows runner
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/qa/smoke-installer.ps1 -PackageVersion $env:RELEASE_VERSION
      - name: Attest portable ZIP and installer (public repositories)
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*-setup.exe
      - name: Upload unsigned QA candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CrocCoc-${{ inputs.version }}-unsigned
          path: |
            release/*.zip
            release/*-setup.exe
            release/download-SHA256SUMS.txt
            release/installer-smoke.json
          if-no-files-found: error